<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #141414; color: #fff; font-family: Arial; }
  header { background: #000; padding: 15px 20px; position: sticky; top: 0; }
  header h1 { color: #e50914; font-size: 24px; }
  #search { background: #333; border: none; color: #fff; padding: 10px; border-radius: 5px; width: 100%; margin-top: 10px; }
  .ad-banner { background: linear-gradient(90deg, #e50914, #ff6b00); padding: 15px; text-align: center; margin: 10px 20px; border-radius: 10px; font-weight: bold; }
  .ad-banner a { color: #fff; text-decoration: none; }
  .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
  .movie-card { background: #222; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
  .movie-card:hover { transform: scale(1.08); }
  .movie-card img { width: 100%; height: 220px; object-fit: cover; }
  .movie-info { padding: 10px; }
  .episode-tag { background: #e50914; color: #fff; font-size: 10px; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }
  #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 200; justify-content: center; align-items: center; }
  #playerModal iframe { width: 95%; height: 50%; max-width: 900px; border: none; border-radius: 10px; }
  #closeBtn { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>🎬 MovieFlix</h1>
  <input type="text" id="search" placeholder="Search movies...">
</header>

<div class="ad-banner">
  <a href="https://wa.me/234XXXXXXXXXX" target="_blank">🔥 ADVERTISE HERE - WhatsApp Us! 🔥</a>
</div>

<div class="movies-grid" id="moviesGrid"></div>

<div id="playerModal">
  <span id="closeBtn">&times;</span>
  <iframe id="videoPlayer" allowfullscreen allow="autoplay"></iframe>
</div>

<script>
  const movies = [
    // YOUR 2 HOUR MOVIE SPLIT INTO 2
    { 
      title: "Sweet Movie Title", 
      year: "2024", 
      youtubeId: "9bzhuKo0UiY",
      startTime: 0, // Part 1 starts at 0 seconds
      episode: "Episode 1"
    },
    { 
      title: "Sweet Movie Title", 
      year: "2024", 
      youtubeId: "9bzhuKo0UiY",
      startTime: 3600, // Part 2 starts at 1 hour = 3600 seconds
      episode: "Episode 2"
    },
    
    // OTHER MOVIES
    { title: "Night of the Living Dead", year: "1968", youtubeId: "tPEE9ZwTUK0", startTime: 0, episode: "" },
    { title: "The General", year: "1926", youtubeId: "vU29ZUyvmSI", startTime: 0, episode: "" },
    { title: "His Girl Friday", year: "1940", youtubeId: "jNQXAC9IVRw", startTime: 0, episode: "" },
    { title: "Nollywood Drama", year: "2023", youtubeId: "fJ9rUzIMcZQ", startTime: 0, episode: "" }
  ];
  
  const grid = document.getElementById('moviesGrid');
  const modal = document.getElementById('playerModal');
  const player = document.getElementById('videoPlayer');
  const closeBtn = document.getElementById('closeBtn');
  const search = document.getElementById('search');
  
  function displayMovies(movieList) {
    grid.innerHTML = '';
    movieList.forEach(movie => {
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.innerHTML = `
        <img src="https://img.youtube.com/vi/${movie.youtubeId}/mqdefault.jpg">
        <div class="movie-info">
          ${movie.episode ? `<span class="episode-tag">${movie.episode}</span>` : ''}
          <h3>${movie.title}</h3>
          <p>${movie.year}</p>
        </div>
      `;
      card.onclick = () => playMovie(movie.youtubeId, movie.startTime);
      grid.appendChild(card);
    });
  }
  
  function playMovie(id, startSeconds) {
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1&start=${startSeconds}`;
    modal.style.display = 'flex';
  }
  
  closeBtn.onclick = () => {
    modal.style.display = 'none';
    player.src = '';
  }
  
  search.oninput = (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = movies.filter(m => m.title.toLowerCase().includes(term));
    displayMovies(filtered);
  }
  
  displayMovies(movies);
</script>

</body>
</html>
