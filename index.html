<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvestPro</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body { 
    font-family: 'Segoe UI', Arial; 
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Pro Bank Gradient */
    color: #fff; 
    text-align: center; 
    padding: 20px; 
    min-height: 100vh;
    margin: 0;
  }
  h1 { text-shadow: 0 0 15px #00ff88; }
  .card { 
    background: rgba(26,26,26,0.75); /* Glass effect */
    backdrop-filter: blur(12px);
    padding: 25px; 
    border-radius: 20px; 
    margin: 20px auto; 
    max-width: 420px; 
    border: 1px solid rgba(0,255,136,0.3);
    box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5);
  }
  .balance { font-size: 36px; color: #00ff88; font-weight: bold; text-shadow: 0 0 15px #00ff88; }
  input { padding: 12px; width: 85%; border-radius: 10px; border: 1px solid #00ff88; background: #111; color: #fff; margin: 12px 0; font-size: 16px; }
  button { padding: 14px 25px; border: none; border-radius: 10px; background: #00ff88; color: #000; font-weight: bold; cursor: pointer; margin: 8px; font-size: 16px; transition: 0.2s; }
  button:hover { background: #00cc70; transform: scale(1.05); }
</style>
</head>
<body>

<h1>InvestPro</h1>

<div class="card">
  <h2>Balance</h2>
  <div class="balance" id="balance">$8,000,000.00</div>
</div>

<div class="card">
  <h3>Deposit</h3>
  <input type="number" id="depositAmount" placeholder="Enter amount">
  <button onclick="deposit()">Deposit →</button>
</div>

<div class="card">
  <h3>Withdraw</h3>
  <input type="number" id="withdrawAmount" placeholder="Enter amount">
  <button onclick="withdraw()">Withdraw ←</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDummyKeyForDemo",
    authDomain: "investpro-demo.firebaseapp.com",
    projectId: "investpro-demo",
    storageBucket: "investpro-demo.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef123456"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const userDoc = db.collection("users").doc("mainUser");

  let balance = 8000000; // Reset to 8M

  userDoc.get().then((doc) => {
    if (doc.exists) {
      balance = doc.data().balance;
    } else {
      userDoc.set({ balance: balance });
    }
    updateUI();
  });

  function updateUI() {
    document.getElementById("balance").innerText = "$" + balance.toLocaleString();
  }

  function saveBalance() {
    userDoc.set({ balance: balance });
  }

  function deposit() {
    let amount = parseFloat(document.getElementById("depositAmount").value);
    if (amount > 0) {
      balance += amount;
      saveBalance();
      updateUI();
      document.getElementById("depositAmount").value = "";
    }
  }

  function withdraw() {
    let amount = parseFloat(document.getElementById("withdrawAmount").value);
    if (amount > 0 && amount <= balance) {
      balance -= amount;
      saveBalance();
      updateUI();
      document.getElementById("withdrawAmount").value = "";
    } else {
      alert("Not enough balance");
    }
  }
</script>

</body>
</html>
