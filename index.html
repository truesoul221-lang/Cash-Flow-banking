<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDummyKeyForDemo",
    authDomain: "investpro-demo.firebaseapp.com",
    projectId: "investpro-demo",
    storageBucket: "investpro-demo.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef123456"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const userDoc = db.collection("users").doc("mainUser");

  let balance = 8000000;

  // LOAD BALANCE FROM FIREBASE
  userDoc.get().then((doc) => {
    if (doc.exists) {
      balance = doc.data().balance;
      console.log("Loaded balance:", balance);
    } else {
      userDoc.set({ balance: balance });
    }
    updateUI();
  }).catch((error) => {
    console.log("Error:", error);
  });

  function updateUI() {
    document.getElementById("balance").innerText = balance.toLocaleString();
  }

  // THIS IS THE FIX - USE UPDATE NOT SET
  function saveBalance() {
    userDoc.update({ balance: balance }).catch(() => {
      userDoc.set({ balance: balance }); // if doc doesn't exist yet
    });
  }

  function showDeposit() {
    document.getElementById("depositPopup").style.display = "flex";
  }
  function closePopup() {
    document.getElementById("depositPopup").style.display = "none";
  }

  function deposit() {
    let amount = parseFloat(document.getElementById("depositAmount").value);
    if (amount > 0) {
      balance += amount;
      saveBalance(); // Save to cloud
      updateUI();
      document.getElementById("depositAmount").value = "";
      closePopup();
      alert("Deposited $" + amount.toLocaleString());
    }
  }
</script>
