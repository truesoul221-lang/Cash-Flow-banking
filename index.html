<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashNow Banking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0f172a;color:#fff;min-height:100vh}
.container{max-width:400px;margin:0 auto;padding:20px}
.header{text-align:center;padding:40px 0}
.header h1{font-size:32px;color:#22c55e;margin-bottom:8px}
.auth-box{background:#1e293b;border-radius:16px;padding:24px;margin-top:20px}
input{width:100%;padding:14px;background:#334155;border:1px solid #475569;border-radius:8px;color:#fff;margin-bottom:12px;font-size:16px}
button{width:100%;padding:14px;background:#22c55e;border:none;border-radius:8px;color:#000;font-weight:700;font-size:16px;cursor:pointer}
button:hover{opacity:0.9}
.dashboard{display:none}
.balance-card{background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:16px;padding:24px;margin-bottom:20px}
.balance{font-size:36px;font-weight:800}
.accounts{background:#1e293b;border-radius:16px;padding:20px}
.account-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #334155}
.hidden{display:none}
.link{color:#22c55e;text-align:center;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>💰 CashNow</h1><p>Your Money, Your Way</p></div>
  
  <div id="auth" class="auth-box">
    <h2 id="authTitle">Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="authBtn">Login</button>
    <p class="link" id="toggleAuth">Don't have an account? Sign up</p>
  </div>

  <div id="dashboard" class="dashboard">
    <div class="balance-card">
      <p>Total Balance</p>
      <div class="balance" id="totalBalance">$8,000,000.00</div>
    </div>
    <div class="accounts">
      <h3>Your Accounts</h3>
      <div id="accountsList"></div>
      <button onclick="addAccount()">+ Add Account</button>
    </div>
    <button onclick="logout()" style="background:#ef4444;margin-top:20px">Logout</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBmKHRkTXg5G-qaVqMIbn_80eKHieB_YrA",
    authDomain: "cash-flow-banking.firebaseapp.com",
    projectId: "cash-flow-banking",
    storageBucket: "cash-flow-banking.firebasestorage.app",
    messagingSenderId: "432592240036",
    appId: "1:432592240036:web:7468c8e7a9277164785531",
    measurementId: "G-9KSSLXX7TH"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isLogin = true;
  const authDiv = document.getElementById('auth');
  const dashDiv = document.getElementById('dashboard');

  document.getElementById('toggleAuth').onclick = () => {
    isLogin = !isLogin;
    document.getElementById('authTitle').innerText = isLogin ? 'Login' : 'Sign Up';
    document.getElementById('authBtn').innerText = isLogin ? 'Login' : 'Sign Up';
    document.getElementById('toggleAuth').innerText = isLogin ? "Don't have an account? Sign up" : "Already have an account? Login";
  }

  document.getElementById('authBtn').onclick = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      if(isLogin){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        // New users get $8,000,000
        await setDoc(doc(db, "users", userCred.user.uid), {
          accounts: [{name: "Main Account", balance: 8000000, id: Date.now()}]
        });
      }
    } catch(e){ alert(e.message) }
  }

  onAuthStateChanged(auth, async (user) => {
    if(user){
      authDiv.classList.add('hidden');
      dashDiv.style.display = 'block';
      loadAccounts(user.uid);
    } else {
      authDiv.classList.remove('hidden');
      dashDiv.style.display = 'none';
    }
  });

  async function loadAccounts(uid){
    const docSnap = await getDoc(doc(db, "users", uid));
    if(docSnap.exists()){
      const data = docSnap.data();
      let total = 0;
      let html = '';
      data.accounts.forEach(acc => {
        total += acc.balance;
        html += `<div class="account-item"><span>${acc.name}</span><span>$${acc.balance.toLocaleString()}</span></div>`;
      });
      document.getElementById('accountsList').innerHTML = html;
      document.getElementById('totalBalance').innerText = `$${total.toLocaleString()}.00`;
    }
  }

  window.addAccount = async () => {
    const name = prompt("Account name:");
    if(!name) return;
    const user = auth.currentUser;
    const docSnap = await getDoc(doc(db, "users", user.uid));
    const accounts = docSnap.data().accounts;
    accounts.push({name, balance: 0, id: Date.now()});
    await updateDoc(doc(db, "users", user.uid), {accounts});
    loadAccounts(user.uid);
  }

  window.logout = () => signOut(auth);
</script>
</body>
</html>
