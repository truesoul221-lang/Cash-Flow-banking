<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvestPro</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body { font-family: Arial; background: #0a0a0a; color: #fff; text-align: center; padding: 20px; }
  .card { background: #1a1a1a; padding: 20px; border-radius: 15px; margin: 10px auto; max-width: 400px; }
  .balance { font-size: 32px; color: #00ff88; font-weight: bold; }
  input { padding: 10px; width: 80%; border-radius: 8px; border: none; margin: 10px 0; }
  button { padding: 12px 20px; border: none; border-radius: 8px; background: #00ff88; color: #000; font-weight: bold; cursor: pointer; margin: 5px; }
  button:hover { background: #00cc70; }
</style>
</head>
<body>

<h1>InvestPro</h1>

<div class="card">
  <h2>Balance</h2>
  <div class="balance" id="balance">$8,000,000.00</div>
</div>

<div class="card">
  <h3>Deposit</h3>
  <input type="number" id="depositAmount" placeholder="Enter amount">
  <button onclick="deposit()">Deposit →</button>
</div>

<div class="card">
  <h3>Withdraw</h3>
  <input type="number" id="withdrawAmount" placeholder="Enter amount">
  <button onclick="withdraw()">Withdraw ←</button>
</div>

<script>
  // 1. YOUR FIREBASE CONFIG - DON'T CHANGE THIS
  const firebaseConfig = {
    apiKey: "AIzaSyDummyKeyForDemo",
    authDomain: "investpro-demo.firebaseapp.com",
    projectId: "investpro-demo",
    storageBucket: "investpro-demo.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef123456"
  };

  // 2. CONNECT TO FIREBASE
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const userDoc = db.collection("users").doc("mainUser");

  let balance = 8000000; // Starting $8,000,000

  // 3. LOAD BALANCE FROM FIREBASE ON START
  userDoc.get().then((doc) => {
    if (doc.exists) {
      balance = doc.data().balance;
    } else {
      // First time, create the document with 8M
      userDoc.set({ balance: balance });
    }
    updateUI();
  });

  function updateUI() {
    document.getElementById("balance").innerText = "$" + balance.toLocaleString();
  }

  // 4. SAVE TO FIREBASE
  function saveBalance() {
    userDoc.set({ balance: balance });
  }

  function deposit() {
    let amount = parseFloat(document.getElementById("depositAmount").value);
    if (amount > 0) {
      balance += amount;
      saveBalance();
      updateUI();
      document.getElementById("depositAmount").value = "";
      alert("Deposited $" + amount.toLocaleString());
    }
  }

  function withdraw() {
    let amount = parseFloat(document.getElementById("withdrawAmount").value);
    if (amount > 0 && amount <= balance) {
      balance -= amount;
      saveBalance();
      updateUI();
      document.getElementById("withdrawAmount").value = "";
      alert("Withdrew $" + amount.toLocaleString());
    } else {
      alert("Not enough balance");
    }
  }
</script>

</body>
</html>
