<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Flow Banking</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a0a0a; color: white; text-align: center; padding-top: 100px; }
   .balance { font-size: 48px; font-weight: bold; color: #00ff88; }
   .label { font-size: 18px; color: #aaa; }
   .loading { font-size: 20px; color: #888; }
  </style>
</head>
<body>

  <div class="label">Available Balance</div>
  <div id="balance" class="loading">Loading...</div>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCuVQe58hRBF4jYB2BJLDRV8MqIMnz_yfc",
      authDomain: "cash-flow-banking-2.firebaseapp.com",
      projectId: "cash-flow-banking-2",
      storageBucket: "cash-flow-banking-2.firebasestorage.app",
      messagingSenderId: "517775896753",
      appId: "1:517775896753:web:40319058b329e3666af290",
      measurementId: "G-PSLV9LLFQG"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // YOUR USER ID
    const userId = "P2IAFNLfzMxtzsNxOOpwWK4Jji2";

    // Fetch balance from Firestore
    async function loadBalance() {
      try {
        const docRef = doc(db, "users", userId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          const balance = data.accounts[0].balance;
          
          // Format with commas and $
          document.getElementById("balance").innerHTML = 
            `<span class="balance">$${balance.toLocaleString()}</span>`;
        } else {
          document.getElementById("balance").innerText = "No data found";
        }
      } catch (error) {
        console.error("Error:", error);
        document.getElementById("balance").innerText = "Error loading balance";
      }
    }

    loadBalance();
  </script>

</body>
</html>
