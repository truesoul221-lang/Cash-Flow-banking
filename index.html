<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash-Flow-banking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a0f;color:#fff;min-height:100vh}
.container{max-width:420px;margin:0 auto;padding:0 20px}
.header{padding:50px 0 30px;text-align:center}
.header h1{font-size:28px;font-weight:700;background:linear-gradient(90deg,#22c55e,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.balance-card{background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);border-radius:24px;padding:28px;margin:20px 0;box-shadow:0 10px 40px rgba(34,197,94,0.3)}
.balance-label{font-size:14px;opacity:0.9;margin-bottom:8px}
.balance{font-size:42px;font-weight:800;letter-spacing:-1px}
.accounts{background:#13131a;border-radius:20px;padding:20px;margin-top:20px}
.account-item{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#1a1a24;border-radius:12px;margin-bottom:10px}
.account-name{font-weight:600}
.account-balance{font-size:18px;font-weight:700;color:#22c55e}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}
.btn-green{background:#22c55e;color:#000}
.btn-red{background:#ef4444;color:#fff}
.auth-box{background:#13131a;border-radius:20px;padding:24px;margin-top:40px}
input{width:100%;padding:14px;background:#1a1a24;border:1px solid #2a2a36;border-radius:10px;color:#fff;margin-bottom:12px;font-size:16px}
.hidden{display:none}
.link{color:#22c55e;text-align:center;margin-top:14px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>💰 CashNow</h1><p style="color:#888;margin-top:6px">Your Money, Your Way</p></div>
  
  <div id="auth" class="auth-box">
    <h2 id="authTitle" style="margin-bottom:16px">Welcome Back</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button class="btn btn-green" id="authBtn">Login</button>
    <p class="link" id="toggleAuth">Don't have an account? Sign up</p>
  </div>

  <div id="dashboard" class="hidden">
    <div class="balance-card">
      <div class="balance-label">Total Balance</div>
      <div class="balance" id="totalBalance">$8,000,000.00</div>
    </div>
    <div class="accounts">
      <h3 style="margin-bottom:14px">Your Accounts</h3>
      <div id="accountsList"></div>
      <button class="btn btn-green" onclick="addAccount()">+ Add Account</button>
    </div>
    <button class="btn btn-red" onclick="logout()">Logout</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmKHRkTXg5G-qaVqMIbn_80eKHieB_YrA",
    authDomain: "cash-flow-banking.firebaseapp.com",
    projectId: "cash-flow-banking",
    storageBucket: "cash-flow-banking.firebasestorage.app",
    messagingSenderId: "432592240036",
    appId: "1:432592240036:web:7468c8e7a9277164785531",
    measurementId: "G-9KSSLXX7TH"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isLogin = true;
  const authDiv = document.getElementById('auth');
  const dashDiv = document.getElementById('dashboard');

  document.getElementById('toggleAuth').onclick = () => {
    isLogin = !isLogin;
    document.getElementById('authTitle').innerText = isLogin ? 'Welcome Back' : 'Create Account';
    document.getElementById('authBtn').innerText = isLogin ? 'Login' : 'Sign Up';
    document.getElementById('toggleAuth').innerText = isLogin ? "Don't have an account? Sign up" : "Already have an account? Login";
  }

  document.getElementById('authBtn').onclick = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      if(isLogin){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", userCred.user.uid), {
          accounts: [{name: "Main Account", balance: 8000000, id: Date.now()}]
        });
      }
    } catch(e){ alert(e.message) }
  }

  onAuthStateChanged(auth, async (user) => {
    if(user){
      authDiv.classList.add('hidden');
      dashDiv.classList.remove('hidden');
      loadAccounts(user.uid);
    } else {
      authDiv.classList.remove('hidden');
      dashDiv.classList.add('hidden');
    }
  });

  async function loadAccounts(uid){
    const docSnap = await getDoc(doc(db, "users", uid));
    if(docSnap.exists()){
      const data = docSnap.data();
      let total = 0;
      let html = '';
      data.accounts.forEach(acc => {
        total += acc.balance;
        html += `<div class="account-item"><div><div class="account-name">${acc.name}</div></div><div class="account-balance">$${acc.balance.toLocaleString()}</div></div>`;
      });
      document.getElementById('accountsList').innerHTML = html;
      document.getElementById('totalBalance').innerText = `$${total.toLocaleString()}.00`;
    }
  }

  window.addAccount = async () => {
    const name = prompt("Account name:");
    if(!name) return;
    const user = auth.currentUser;
    const docSnap = await getDoc(doc(db, "users", user.uid));
    const accounts = docSnap.data().accounts;
    accounts.push({name, balance: 0, id: Date.now()});
    await updateDoc(doc(db, "users", user.uid), {accounts});
    loadAccounts(user.uid);
  }

  window.logout = () => signOut(auth);
</script>
</body>
</html>
