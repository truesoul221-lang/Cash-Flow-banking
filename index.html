<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Flow Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    // 1. IMPORT FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 2. PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 3. INIT FIREBASE
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 4. LOAD USER DATA FROM FIRESTORE
    async function loadUserData() {
      try {
        // This is your doc ID from the screenshot
        const docRef = doc(db, "users", "cn2IAFNLfzMxtzsNx00pwWK4Jji2");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const user = docSnap.data();
          const account = user.accounts[0];
          
          // KEY FIX: Read balance from Firestore instead of hardcoding
          const balance = account.balance; // This is 8000000
          const name = account.name || "User";
          const email = account.email || "";

          // Update the page
          document.getElementById('greeting').textContent = `Good evening, ${name.split(' ')[0]}`;
          document.getElementById('balance').textContent = `USD ${balance.toLocaleString()}`;
          document.getElementById('email').textContent = email;
          
        } else {
          document.getElementById('balance').textContent = "User not found";
        }
      } catch (error) {
        console.error("Error loading data: ", error);
        document.getElementById('balance').textContent = "Error loading balance";
      }
    }

    window.onload = loadUserData;
  </script>
</head>
<body class="bg-[#0B0F1A] text-white min-h-screen p-6">
  
  <div class="max-w-md mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 id="greeting" class="text-2xl font-bold">Good evening, Sa...</h1>
      <p id="email" class="text-gray-400 text-sm">test@test.com</p>
    </div>

    <!-- Balance Card -->
    <div class="bg-gradient-to-br from-blue-600 to-purple-700 p-6 rounded-3xl shadow-2xl">
      <p class="text-blue-100 text-sm">Total Balance</p>
      <h2 id="balance" class="text-4xl font-bold mt-2">USD 0</h2>
      <p class="text-blue-100 text-xs mt-4">Account: •••• 2222</p>
    </div>

    <!-- Quick Actions -->
    <div class="grid grid-cols-4 gap-4 mt-8">
      <div class="text-center">
        <div class="bg-gray-800 p-4 rounded-2xl">📤</div>
        <p class="text-xs mt-2">Send</p>
      </div>
      <div class="text-center">
        <div class="bg-gray-800 p-4 rounded-2xl">📥</div>
        <p class="text-xs mt-2">Receive</p>
      </div>
      <div class="text-center">
        <div class="bg-gray-800 p-4 rounded-2xl">💳</div>
        <p class="text-xs mt-2">Cards</p>
      </div>
      <div class="text-center">
        <div class="bg-gray-800 p-4 rounded-2xl">📊</div>
        <p class="text-xs mt-2">Stats</p>
      </div>
    </div>
  </div>

</body>
</html>
