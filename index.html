<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Flow</title> <!-- CHANGED THIS -->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
  body { background: #0a0e1a; color: #fff; padding: 15px; min-height: 100vh; }
  
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .menu { font-size: 24px; cursor: pointer; }
  .avatar { width: 40px; height: 40px; background: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  
  .logo { font-size: 24px; font-weight: bold; color: #2563eb; margin-bottom: 10px; } /* ADDED */
  
  h2 { font-size: 22px; margin-bottom: 5px; }
  .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
  
  .btn-row { display: flex; gap: 10px; margin-bottom: 25px; }
  .btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
  .btn-blue { background: #2563eb; color: #fff; }
  .btn-dark { background: #1e293b; color: #fff; }
  
  .overview-card { 
    background: linear-gradient(135deg, #2563eb, #1d4ed8); 
    border-radius: 20px; 
    padding: 20px; 
    margin-bottom: 25px;
  }
  .overview-top { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
  .profile-pic { width: 50px; height: 50px; border-radius: 50%; background: #ccc; }
  .balance-text { color: #bfdbfe; font-size: 12px; }
  .balance-amount { font-size: 32px; font-weight: bold; }
  .email { color: #bfdbfe; font-size: 14px; }
  .overview-bottom { display: flex; justify-content: space-between; font-size: 12px; color: #bfdbfe; margin-top: 15px; }
  
  .section { margin-bottom: 20px; }
  .section h3 { margin-bottom: 10px; }
  .link { color: #2563eb; text-decoration: none; }
  
  .logout { width: 100%; padding: 15px; background: #ef4444; color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
  
  .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
  .popup-content { background: #1e293b; padding: 20px; border-radius: 15px; width: 90%; max-width: 350px; }
  .popup input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0a0e1a; color: #fff; }
</style>
</head>
<body>

<div class="topbar">
  <div class="menu">☰</div>
  <div class="avatar">A</div>
</div>

<div class="logo">Cash Flow</div> <!-- ADDED THIS -->

<h2>Good evening test</h2>
<p class="subtitle">At a glance summary of your account!</p>

<div class="btn-row">
  <button class="btn btn-blue" onclick="showDeposit()">Deposit →</button>
  <button class="btn btn-dark">Transfer Fund</button>
</div>

<h3>Overview</h3>
<div class="overview-card">
  <div class="overview-top">
    <img src="https://i.pravatar.cc/50" class="profile-pic">
    <div>
      <div class="balance-text">Available balance</div>
      <div class="balance-amount">USD <span id="balance">10,000,050</span></div>
      <div class="email">test@test.com</div>
    </div>
  </div>
  <div class="overview-bottom">
    <div>Last Login<br>09 Jun 26, 18:52 pm</div>
    <div>Your IP address<br>127.1.1.0</div>
  </div>
</div>

<div class="section">
  <h3>Checking Account</h3>
  <a href="#" class="link">Transfer Fund</a>
</div>

<button class="logout">Logout</button>

<!-- Deposit Popup -->
<div class="popup" id="depositPopup">
  <div class="popup-content">
    <h3>Deposit Funds</h3>
    <input type="number" id="depositAmount" placeholder="Enter amount">
    <button class="btn btn-blue" onclick="deposit()">Confirm Deposit</button>
    <button class="btn btn-dark" onclick="closePopup()">Cancel</button>
  </div>
</div>

<script>
  let balance = localStorage.getItem("cashflow_balance");
  
  if(balance === null) {
    balance = 10000050; // Your current balance
  } else {
    balance = parseFloat(balance);
  }
  
  updateUI();

  function updateUI() {
    document.getElementById("balance").innerText = balance.toLocaleString();
  }

  function saveBalance() {
    localStorage.setItem("cashflow_balance", balance);
  }

  function showDeposit() {
    document.getElementById("depositPopup").style.display = "flex";
  }
  function closePopup() {
    document.getElementById("depositPopup").style.display = "none";
  }

  function deposit() {
    let amount = parseFloat(document.getElementById("depositAmount").value);
    if (amount > 0) {
      balance += amount;
      saveBalance();
      updateUI();
      document.getElementById("depositAmount").value = "";
      closePopup();
      alert("Deposited $" + amount.toLocaleString());
    }
  }
</script>

</body>
</html>
