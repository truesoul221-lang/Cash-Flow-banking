<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashNow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0d1117;color:#fff;min-height:100vh}
.container{max-width:420px;margin:0 auto;padding:0 16px}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.greet-box{background:#151b23;border:1px solid #2a3441;border-radius:12px;padding:16px;margin:16px 0}
.greet{font-size:18px;font-weight:600;color:#ffd700;margin-bottom:4px}
.greet-sub{font-size:13px;color:#8892a6}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn{padding:10px 16px;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
.btn-purple{background:#6d28d9;color:#fff}
.btn-gray{background:#2a3441;color:#fff}
.balance-card{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);border-radius:16px;padding:20px;margin:20px 0;display:flex;gap:16px;align-items:center}
.avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:24px}
.balance-info{flex:1}
.balance-label{font-size:12px;opacity:0.8}
.balance{font-size:28px;font-weight:800;margin:4px 0}
.balance-name{font-size:12px;opacity:0.9}
.info-row{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;color:#cbd5e1}
.account-section{margin-top:24px}
.account-title{font-size:16px;font-weight:700;color:#ffd700;margin-bottom:8px}
.link{color:#3b82f6;font-size:14px}
.auth-box{background:#151b23;border-radius:16px;padding:24px;margin-top:40px}
input{width:100%;padding:14px;background:#0d1117;border:1px solid #2a3441;border-radius:10px;color:#fff;margin-bottom:12px;font-size:16px}
.hidden{display:none}
.link-text{color:#22c55e;text-align:center;margin-top:14px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
        <rect x="4" y="8" width="32" height="24" rx="6" stroke="url(#g)" stroke-width="2"/>
        <circle cx="20" cy="20" r="5" fill="url(#g)"/>
        <defs><linearGradient id="g"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
      </svg>
      CashNow
    </div>
    <div style="width:36px;height:36px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:700">A</div>
  </div>
  
  <div id="auth" class="auth-box">
    <h2 id="authTitle" style="margin-bottom:16px">Welcome Back</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button class="btn btn-purple" id="authBtn" style="width:100%">Login</button>
    <p class="link-text" id="toggleAuth">Don't have an account? Sign up</p>
  </div>

  <div id="dashboard" class="hidden">
    <div class="greet-box">
      <div class="greet" id="greeting">Good evening Anthony</div>
      <div class="greet-sub">At a glance summary of your account!</div>
      <div class="btn-row">
        <button class="btn btn-purple" onclick="alert('Deposit coming soon')">Deposit →</button>
        <button class="btn btn-gray" onclick="alert('Transfer coming soon')">Transfer Fund</button>
      </div>
    </div>

    <div style="font-weight:700;margin:16px 0">Overview</div>

    <div class="balance-card">
      <div class="avatar">👤</div>
      <div class="balance-info">
        <div class="balance-label">Available balance</div>
        <div class="balance">USD <span id="totalBalance">8,000,000</span></div>
        <div class="balance-name" id="userName">User</div>
        <div class="info-row">
          <div>Last Login<br><span id="lastLogin">--</span></div>
          <div>Your IP address<br>127.0.0.1</div>
        </div>
      </div>
    </div>

    <div class="account-section">
      <div class="account-title">Checking Account</div>
      <div id="accountsList"></div>
      <button class="btn btn-purple" onclick="addAccount()" style="width:100%;margin-top:12px">+ Add Account</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmKHRkTXg5G-qaVqMIbn_80eKHieB_YrA",
    authDomain: "cash-flow-banking.firebaseapp.com",
    projectId: "cash-flow-banking",
    storageBucket: "cash-flow-banking.firebasestorage.app",
    messagingSenderId: "432592240036",
    appId: "1:432592240036:web:7468c8e7a9277164785531",
    measurementId: "G-9KSSLXX7TH"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isLogin = true;
  const authDiv = document.getElementById('auth');
  const dashDiv = document.getElementById('dashboard');

  document.getElementById('toggleAuth').onclick = () => {
    isLogin =!isLogin;
    document.getElementById('authTitle').innerText = isLogin? 'Welcome Back' : 'Create Account';
    document.getElementById('authBtn').innerText = isLogin? 'Login' : 'Sign Up';
    document.getElementById('toggleAuth').innerText = isLogin? "Don't have an account? Sign up" : "Already have an account? Login";
  }

  document.getElementById('authBtn').onclick = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      if(isLogin){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", userCred.user.uid), {
          accounts: [{name: "Checking Account", balance: 8000000, id: Date.now()}]
        });
      }
    } catch(e){ alert(e.message) }
  }

  onAuthStateChanged(auth, async (user) => {
    if(user){
      authDiv.classList.add('hidden');
      dashDiv.classList.remove('hidden');
      const name = user.email.split('@')[0];
      document.getElementById('greeting').innerText = `Good evening ${name}`;
      document.getElementById('userName').innerText = name;
      document.getElementById('lastLogin').innerText = new Date().toLocaleString();
      loadAccounts(user.uid);
    } else {
      authDiv.classList.remove('hidden');
      dashDiv.classList.add('hidden');
    }
  });

  async function loadAccounts(uid){
    const docSnap = await getDoc(doc(db, "users", uid));
    if(docSnap.exists()){
      const data = docSnap.data();
      let total = 0;
      let html = '';
      data.accounts.forEach(acc => {
        total += acc.balance;
        html += `<div style="background:#151b23;padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between"><span>${acc.name}</span><span style="color:#22c55e;font-weight:700">$${acc.balance.toLocaleString()}</span></div>`;
      });
      document.getElementById('accountsList').innerHTML = html;
      document.getElementById('totalBalance').innerText = total.toLocaleString();
    }
  }

  window.addAccount = async () => {
    const name = prompt("Account name:");
    if(!name) return;
    const user = auth.currentUser;
    const docSnap = await getDoc(doc(db, "users", user.uid));
    const accounts = docSnap.data().accounts;
    accounts.push({name, balance: 0, id: Date.now()});
    await updateDoc(doc(db, "users", user.uid), {accounts});
    loadAccounts(user.uid);
  }
</script>
</body>
  </html>
