<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Street Racer Pro</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Arial'; }
  
  #gameArea {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(#1a1a1a 0%, #2a2a2a 100%);
    position: relative;
    overflow: hidden;
  }
  
  .road {
    width: 320px;
    height: 100%;
    background: #3a3a3a;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  
  .road-edge {
    position: absolute;
    width: 8px;
    height: 100%;
    background: #ffcc00;
  }
  .left { left: calc(50% - 160px); }
  .right { right: calc(50% - 160px); }
  
  .line {
    width: 6px;
    height: 60px;
    background: #fff;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 2px;
  }
  
  /* CAR DESIGN */
  .car {
    width: 45px;
    height: 85px;
    position: absolute;
    border-radius: 12px 12px 4px 4px;
  }
  
  #player {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
  }
  /* Windshield */
  #player::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 5px;
    width: 35px;
    height: 20px;
    background: rgba(0,0,0,0.6);
    border-radius: 6px;
    border: 1px solid #000;
  }
  /* Headlights */
  #player::after {
    content: '';
    position: absolute;
    bottom: 5px;
    left: 5px;
    width: 10px;
    height: 8px;
    background: #ffff99;
    border-radius: 3px;
    box-shadow: 25px 0 0 #ffff99;
  }
  
  .enemy {
    background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
    border: 2px solid #f87171;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
  }
  .enemy::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 5px;
    width: 35px;
    height: 20px;
    background: rgba(0,0,0,0.6);
    border-radius: 6px;
    border: 1px solid #7f1d1d;
  }
  .enemy::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    width: 10px;
    height: 8px;
    background: #ff0000;
    border-radius: 3px;
    box-shadow: 25px 0 0 #ff0000;
  }
  
  /* COLOR CLASSES */
  .blue { background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%); border: 2px solid #3b82f6; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
  .red { background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%); border: 2px solid #f87171; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
  .green { background: linear-gradient(180deg, #10b981 0%, #059669 100%); border: 2px solid #34d399; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
  .yellow { background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%); border: 2px solid #fcd34d; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); }
  .purple { background: linear-gradient(180deg, #a855f7 0%, #9333ea 100%); border: 2px solid #c084fc; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
  
  #score {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
  }
  
  #colorPicker {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 8px;
  }
  
  .colorBtn {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    border: 3px solid #fff;
    cursor: pointer;
  }
  .c-blue { background: #2563eb; }
  .c-red { background: #ef4444; }
  .c-green { background: #10b981; }
  .c-yellow { background: #fbbf24; }
  .c-purple { background: #a855f7; }
  
  #controls {
    position: absolute;
    bottom: 30px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 40px;
  }
  
  .btn {
    width: 80px;
    height: 80px;
    background: rgba(37, 99, 235, 0.3);
    border: 3px solid #2563eb;
    border-radius: 50%;
    color: #fff;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
  }
  
  #gameOver {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95);
    color: #fff;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    display: none;
    border: 2px solid #2563eb;
  }
  
  #restart {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    border: none;
    color: #fff;
    padding: 12px 30px;
    border-radius: 10px;
    font-size: 18px;
    margin-top: 15px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="gameArea">
  <div class="road"></div>
  <div class="road-edge left"></div>
  <div class="road-edge right"></div>
  <div id="score">Score: 0</div>
  
  <div id="colorPicker">
    <div class="colorBtn c-blue" onclick="changeColor('blue')"></div>
    <div class="colorBtn c-red" onclick="changeColor('red')"></div>
    <div class="colorBtn c-green" onclick="changeColor('green')"></div>
    <div class="colorBtn c-yellow" onclick="changeColor('yellow')"></div>
    <div class="colorBtn c-purple" onclick="changeColor('purple')"></div>
  </div>
  
  <div id="player" class="car blue"></div>
  
  <div id="controls">
    <div class="btn" id="leftBtn">←</div>
    <div class="btn" id="rightBtn">→</div>
  </div>
  
  <div id="gameOver">
    <h2>💥 CRASHED!</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restart" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
  const player = document.getElementById('player');
  const gameArea = document.getElementById('gameArea');
  let playerX = 150;
  let speed = 5;
  let score = 0;
  let gameRunning = true;
  let enemies = [];
  
  document.getElementById('leftBtn').addEventListener('touchstart', () => moveLeft());
  document.getElementById('rightBtn').addEventListener('touchstart', () => moveRight());
  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') moveLeft();
    if(e.key === 'ArrowRight') moveRight();
  });
  
  function moveLeft() {
    if(playerX > 110 && gameRunning) playerX -= 30;
  }
  function moveRight() {
    if(playerX < 190 && gameRunning) playerX += 30;
  }
  
  function changeColor(color) {
    player.className = 'car ' + color;
  }
  
  function createEnemy() {
    const enemy = document.createElement('div');
    enemy.classList.add('enemy', 'car');
    enemy.style.left = Math.random() > 0.5 ? '130px' : '190px';
    enemy.style.top = '-100px';
    gameArea.appendChild(enemy);
    enemies.push(enemy);
  }
  
  function gameLoop() {
    if(!gameRunning) return;
    
    player.style.left = playerX + 'px';
    
    enemies.forEach((enemy, i) => {
      let enemyTop = parseInt(enemy.style.top) + speed;
      enemy.style.top = enemyTop + 'px';
      
      if(enemyTop > window.innerHeight) {
        enemy.remove();
        enemies.splice(i, 1);
        score++;
        document.getElementById('score').innerText = 'Score: ' + score;
        if(score % 5 === 0) speed += 0.5;
      }
      
      let playerRect = player.getBoundingClientRect();
      let enemyRect = enemy.getBoundingClientRect();
      if(playerRect.left < enemyRect.right &&
         playerRect.right > enemyRect.left &&
         playerRect.top < enemyRect.bottom &&
         playerRect.bottom > enemyRect.top) {
        gameOver();
      }
    });
    
    document.querySelectorAll('.line').forEach(line => {
      let top = parseInt(line.style.top) + speed;
      line.style.top = top + 'px';
      if(top > window.innerHeight) line.style.top = '-80px';
    });
    
    requestAnimationFrame(gameLoop);
  }
  
  for(let i = 0; i < 10; i++) {
    const line = document.createElement('div');
    line.classList.add('line');
    line.style.top = i * 100 + 'px';
    gameArea.appendChild(line);
  }
  
  setInterval(() => {
    if(gameRunning) createEnemy();
  }, 1500);
  
  function gameOver() {
    gameRunning = false;
    document.getElementById('finalScore').innerText = 'Score: ' + score;
    document.getElementById('gameOver').style.display = 'block';
  }
  
  function restartGame() {
    enemies.forEach(e => e.remove());
    enemies = [];
    score = 0;
    speed = 5;
    gameRunning = true;
    document.getElementById('score').innerText = 'Score: 0';
    document.getElementById('gameOver').style.display = 'none';
    gameLoop();
  }
  
  gameLoop();
</script>

</body>
</html>
