<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Subway Runner</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Arial'; }
  
  #gameArea {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(#87CEEB 0%, #4682B4 100%);
    position: relative;
    overflow: hidden;
  }
  
  /* 3 TRAIN TRACKS */
 .track {
    width: 360px;
    height: 100%;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
  }
  
 .lane {
    flex: 1;
    border-left: 2px solid #555;
    border-right: 2px solid #555;
    position: relative;
    background: #2a2a2a;
  }
  
 .rail {
    position: absolute;
    width: 4px;
    height: 100%;
    background: #666;
    left: 50%;
    transform: translateX(-50%);
  }
  
  /* PLAYER */
  #player {
    width: 40px;
    height: 80px;
    position: absolute;
    bottom: 30px;
    border-radius: 10px 10px 5px 5px;
    transition: left 0.15s, bottom 0.2s;
    z-index: 10;
  }
  /* Head */
  #player::before {
    content: '';
    position: absolute;
    top: -15px;
    left: 10px;
    width: 20px;
    height: 20px;
    background: #fdbcb4;
    border-radius: 50%;
    border: 2px solid #000;
  }
  
  /* TRAIN */
 .train {
    width: 100%;
    height: 100px;
    background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
    position: absolute;
    border-radius: 8px;
    border: 3px solid #000;
  }
 .train::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 5px;
    width: 30px;
    height: 20px;
    background: rgba(255,255,255,0.8);
    border-radius: 3px;
  }
  
  /* COINS */
 .coin {
    width: 25px;
    height: 25px;
    background: radial-gradient(circle, #ffd700 0%, #ffaa00 100%);
    border-radius: 50%;
    position: absolute;
    border: 2px solid #ffaa00;
    box-shadow: 0 0 10px #ffd700;
  }
  
  #score {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
  }
  
  #coins {
    position: absolute;
    top: 50px;
    left: 20px;
    color: #ffd700;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
  }
  
  #controls {
    position: absolute;
    bottom: 30px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 30px;
  }
  
 .btn {
    width: 70px;
    height: 70px;
    background: rgba(255,255,255,0.2);
    border: 3px solid #fff;
    border-radius: 50%;
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
  }
  
  #gameOver {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95);
    color: #fff;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    display: none;
    border: 2px solid #ffd700;
  }
  
  #restart {
    background: linear-gradient(180deg, #10b981 0%, #059669 100%);
    border: none;
    color: #fff;
    padding: 12px 30px;
    border-radius: 10px;
    font-size: 18px;
    margin-top: 15px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="gameArea">
  <div class="track">
    <div class="lane"><div class="rail"></div></div>
    <div class="lane"><div class="rail"></div></div>
    <div class="lane"><div class="rail"></div></div>
  </div>
  
  <div id="score">Score: 0</div>
  <div id="coins">Coins: 0</div>
  <div id="player" class="blue"></div>
  
  <div id="controls">
    <div class="btn" id="leftBtn">←</div>
    <div class="btn" id="upBtn">↑</div>
    <div class="btn" id="downBtn">↓</div>
    <div class="btn" id="rightBtn">→</div>
  </div>
  
  <div id="gameOver">
    <h2>💥 GAME OVER!</h2>
    <p id="finalScore">Score: 0</p>
    <p id="finalCoins">Coins: 0</p>
    <button id="restart" onclick="restartGame()">Run Again</button>
  </div>
</div>

<script>
  const player = document.getElementById('player');
  const gameArea = document.getElementById('gameArea');
  let currentLane = 1; // 0, 1, 2
  let lanePositions = [60, 180, 300];
  let speed = 6;
  let score = 0;
  let coins = 0;
  let gameRunning = true;
  let obstacles = [];
  let isJumping = false;
  
  // Controls
  document.getElementById('leftBtn').addEventListener('touchstart', () => moveLane(-1));
  document.getElementById('rightBtn').addEventListener('touchstart', () => moveLane(1));
  document.getElementById('upBtn').addEventListener('touchstart', () => jump());
  document.getElementById('downBtn').addEventListener('touchstart', () => slide());
  
  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') moveLane(-1);
    if(e.key === 'ArrowRight') moveLane(1);
    if(e.key === 'ArrowUp') jump();
    if(e.key === 'ArrowDown') slide();
  });
  
  function moveLane(dir) {
    if(!gameRunning) return;
    currentLane += dir;
    if(currentLane < 0) currentLane = 0;
    if(currentLane > 2) currentLane = 2;
    player.style.left = lanePositions[currentLane] + 'px';
  }
  
  function jump() {
    if(isJumping ||!gameRunning) return;
    isJumping = true;
    player.style.bottom = '120px';
    setTimeout(() => {
      player.style.bottom = '30px';
      isJumping = false;
    }, 400);
  }
  
  function slide() {
    if(!gameRunning) return;
    player.style.height = '40px';
    setTimeout(() => {
      player.style.height = '80px';
    }, 500);
  }
  
  function createObstacle() {
    const type = Math.random();
    const lane = Math.floor(Math.random() * 3);
    const obj = document.createElement('div');
    
    if(type > 0.6) {
      // COIN
      obj.classList.add('coin');
      obj.style.left = lanePositions[lane] + 17 + 'px';
    } else {
      // TRAIN
      obj.classList.add('train');
      obj.style.left = lanePositions[lane] - 20 + 'px';
    }
    
    obj.style.top = '-120px';
    obj.dataset.lane = lane;
    gameArea.appendChild(obj);
    obstacles.push(obj);
  }
  
  function gameLoop() {
    if(!gameRunning) return;
    
    obstacles.forEach((obj, i) => {
      let top = parseInt(obj.style.top) + speed;
      obj.style.top = top + 'px';
      
      if(top > window.innerHeight) {
        obj.remove();
        obstacles.splice(i, 1);
        if(obj.classList.contains('train')) {
          score++;
          document.getElementById('score').innerText = 'Score: ' + score;
          if(score % 5 === 0) speed += 0.5;
        }
      }
      
      // Collision
      let playerRect = player.getBoundingClientRect();
      let objRect = obj.getBoundingClientRect();
      if(playerRect.left < objRect.right &&
         playerRect.right > objRect.left &&
         playerRect.top < objRect.bottom &&
         playerRect.bottom > objRect.top) {
        
        if(obj.classList.contains('coin')) {
          coins++;
          document.getElementById('coins').innerText = 'Coins: ' + coins;
          obj.remove();
          obstacles.splice(i, 1);
        } else if(!isJumping) {
          gameOver();
        }
      }
    });
    
    requestAnimationFrame(gameLoop);
  }
  
  setInterval(() => {
    if(gameRunning) createObstacle();
  }, 1200);
  
  function gameOver() {
    gameRunning = false;
    document.getElementById('finalScore').innerText = 'Score: ' + score;
    document.getElementById('finalCoins').innerText = 'Coins: ' + coins;
    document.getElementById('gameOver').style.display = 'block';
  }
  
  function restartGame() {
    obstacles.forEach(o => o.remove());
    obstacles = [];
    score = 0;
    coins = 0;
    speed = 6;
    gameRunning = true;
    currentLane = 1;
    player.style.left = lanePositions[1] + 'px';
    document.getElementById('score').innerText = 'Score: 0';
    document.getElementById('coins').innerText = 'Coins: 0';
    document.getElementById('gameOver').style.display = 'none';
    gameLoop();
  }
  
  player.style.left = lanePositions[1] + 'px';
  gameLoop();
</script>

</body>
</html>
