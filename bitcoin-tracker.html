<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Tracker - Live BTC</title>
<style>
  body { 
    margin:0; background:#0a0a0a; color:#fff; font-family:'Arial', sans-serif; 
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
  }
  .container { max-width:900px; margin:0 auto; padding:20px; }
  .header { text-align:center; padding:20px; }
  .header h1 { color:#F7931A; font-size:32px; margin:0; }
  .price-card { 
    background:#1e1e1e; padding:30px; border-radius:15px; margin:20px 0; 
    border:2px solid #F7931A; text-align:center; 
  }
  .btc-price { font-size:48px; font-weight:bold; color:#F7931A; }
  .change { font-size:18px; margin-top:10px; }
  .green { color:#00ff88; }
  .red { color:#ff4444; }
  .wallet { 
    background:#1e1e1e; padding:20px; border-radius:15px; margin:20px 0;
  }
  input { 
    width:100%; padding:12px; background:#2a2a2a; border:1px solid #444; 
    color:#fff; border-radius:8px; margin:10px 0; font-size:16px;
  }
  button { 
    width:100%; padding:15px; background:#F7931A; border:none; color:#000; 
    font-weight:bold; font-size:18px; border-radius:8px; cursor:pointer;
  }
  button:hover { background:#ffb347; }
  .wallet-info { margin-top:15px; padding:15px; background:#2a2a2a; border-radius:10px; }
  #chart { width:100%; height:300px; background:#1e1e1e; border-radius:15px; margin:20px 0; }
  .footer { text-align:center; padding:20px; color:#666; font-size:12px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>₿ BITCOIN TRACKER</h1>
    <p>Live BTC Price + Wallet Balance</p>
  </div>

  <div class="price-card">
    <div>Bitcoin Price USD</div>
    <div class="btc-price" id="btcPrice">Loading...</div>
    <div class="change" id="btcChange">Loading...</div>
    <div style="margin-top:10px; color:#888;">Last updated: <span id="lastUpdate">-</span></div>
  </div>

  <div class="wallet">
    <h2>Check Wallet Balance</h2>
    <input type="text" id="walletAddress" placeholder="Enter BTC Wallet Address">
    <button onclick="checkWallet()">CHECK BALANCE</button>
    <div class="wallet-info" id="walletInfo" style="display:none;">
      <div>Balance: <span id="balance">0</span> BTC</div>
      <div>USD Value: $<span id="usdValue">0</span></div>
      <div>Transactions: <span id="txCount">0</span></div>
    </div>
  </div>

  <canvas id="chart"></canvas>

  <div class="footer">
    Data from CoinGecko + Blockchain.com API | For educational use only
  </div>
</div>

<script>
let btcPriceUSD = 0;

// 1. GET LIVE BTC PRICE
async function getBTCPrice() {
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true');
    const data = await res.json();
    btcPriceUSD = data.bitcoin.usd;
    const change = data.bitcoin.usd_24h_change;
    
    document.getElementById('btcPrice').innerText = '$' + btcPriceUSD.toLocaleString();
    document.getElementById('btcChange').innerText = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
    document.getElementById('btcChange').className = 'change ' + (change > 0 ? 'green' : 'red');
    document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('btcPrice').innerText = 'Error loading price';
  }
}

// 2. CHECK WALLET BALANCE
async function checkWallet() {
  const address = document.getElementById('walletAddress').value;
  if(!address) return alert('Enter wallet address');
  
  document.getElementById('walletInfo').style.display = 'block';
  document.getElementById('balance').innerText = 'Loading...';
  
  try {
    const res = await fetch(`https://blockchain.info/rawaddr/${address}`);
    const data = await res.json();
    
    const balanceBTC = data.final_balance / 100000000;
    const usdValue = balanceBTC * btcPriceUSD;
    
    document.getElementById('balance').innerText = balanceBTC.toFixed(8);
    document.getElementById('usdValue').innerText = usdValue.toLocaleString();
    document.getElementById('txCount').innerText = data.n_tx;
  } catch(e) {
    alert('Invalid wallet address or API error');
  }
}

// 3. DRAW SIMPLE PRICE CHART
function drawChart() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = 300;
  
  // Fake 24h chart data for demo
  ctx.strokeStyle = '#F7931A';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for(let i=0; i<24; i++){
    const x = (i/23) * canvas.width;
    const y = canvas.height/2 + Math.sin(i/3) * 50 + Math.random()*20;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();
  
  ctx.fillStyle = '#888';
  ctx.font = '14px Arial';
  ctx.fillText('24H Price Chart', 10, 20);
}

getBTCPrice();
drawChart();
setInterval(getBTCPrice, 30000); // Update every 30 seconds
</script>

</body>
  </html>
