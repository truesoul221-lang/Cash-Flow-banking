<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaijaPrank Cam</title>
<style>
  body { background:#000; color:#fff; font-family:Arial; text-align:center; padding:10px; }
  h1 { color:#ff0000; }
  video { width:90%; max-width:400px; border-radius:20px; border:3px solid #ff0000; margin:10px; }
  .filters button { padding:10px; margin:5px; border:none; border-radius:10px; background:#222; color:#fff; cursor:pointer; }
  .filters button.active { background:#ff0000; }
  .call-screen { background:#111; padding:15px; border-radius:20px; display:none; }
  input { padding:10px; border-radius:10px; border:none; width:80%; margin:5px; }
</style>
</head>
<body>

<h1>🇳🇬 NaijaPrank Cam</h1>
<p>Fake video call + Face change 😂</p>

<input type="text" id="callerName" placeholder="Enter fake caller name: Mummy, DPO, Bank">
<button onclick="startCall()" style="background:#008751; color:#fff; padding:12px 20px; border:none; border-radius:10px;">📞 Start Fake Call</button>

<div class="call-screen" id="callScreen">
  <h2 id="callerDisplay">Calling...</h2>
  <video id="video" autoplay playsinline></video>
  
  <h3>Change Face:</h3>
  <div class="filters">
    <button onclick="setFilter('none')" class="active">Normal</button>
    <button onclick="setFilter('sepia(1)')">Old Man</button>
    <button onclick="setFilter('hue-rotate(180deg)')">Alien</button>
    <button onclick="setFilter('blur(2px)')">Blur Face</button>
    <button onclick="setFilter('contrast(200%)')">Cartoon</button>
  </div>
  
  <button onclick="endCall()" style="background:#ff0000; color:#fff; padding:12px 20px; border:none; border-radius:10px; margin-top:10px;">End Call</button>
</div>

<script>
const video = document.getElementById('video');
let stream;

async function startCall() {
  const name = document.getElementById('callerName').value || "Unknown";
  document.getElementById('callerDisplay').innerText = "📞 " + name + " is calling...";
  document.getElementById('callScreen').style.display = "block";
  
  stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  video.srcObject = stream;
}

function setFilter(filter) {
  video.style.filter = filter;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function endCall() {
  if(stream) stream.getTracks().forEach(track => track.stop());
  document.getElementById('callScreen').style.display = "none";
  alert("Prank ended 😂 Video not saved yet. Want me to add recording?");
}
</script>

</body>
</html>
