<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VibeTok</title>
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {background:#000; color:#fff; font-family:Arial; overflow:hidden;}
.back {position:fixed; top:15px; left:15px; z-index:20; background:rgba(0,0,0,0.7); padding:10px 15px; border-radius:20px; color:#fff; text-decoration:none;}
.feed {height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory;}
.video-card {height:100vh; position:relative; scroll-snap-align:start; background:#111;}
.video {width:100%; height:100%; object-fit:cover;}
.video-info {position:absolute; left:15px; bottom:80px; z-index:5;}
.username {font-size:18px; font-weight:bold; margin-bottom:5px;}
.caption {font-size:14px; opacity:0.9;}
.actions {position:absolute; right:12px; bottom:80px; display:flex; flex-direction:column; gap:20px; text-align:center;}
.icon {font-size:32px;}
.bottom-nav {position:fixed; bottom:0; width:100%; height:60px; display:flex; justify-content:space-around; align-items:center; background:rgba(0,0,0,.9); z-index:10; border-top:1px solid #222;}
</style>
</head>
<body>
<a href="index.html" class="back">← Back</a>
<div class="feed">
  <div class="video-card">
    <video class="video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" autoplay loop muted playsinline></video>
    <div class="video-info">
      <div class="username">@ceo_vibes</div>
      <div class="caption">Cash Flow Banking is LIVE! 🚀 #startup #ceo</div>
    </div>
    <div class="actions">
      <div><div class="icon">❤️</div>12K</div>
      <div><div class="icon">💬</div>450</div>
      <div><div class="icon">🔗</div>Share</div>
    </div>
  </div>
  <div class="video-card">
    <video class="video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" loop muted playsinline></video>
    <div class="video-info">
      <div class="username">@lagos_creator</div>
      <div class="caption">Building the next big thing in Lagos 🇳🇬</div>
    </div>
    <div class="actions">
      <div><div class="icon">❤️</div>45K</div>
      <div><div class="icon">💬</div>1.2K</div>
      <div><div class="icon">🔗</div>Share</div>
    </div>
  </div>
</div>
<div class="bottom-nav">
  <div>🏠</div><div>🔍</div><div>➕</div><div>📥</div><div>👤</div>
</div>
<script>
const videos = document.querySelectorAll('.video');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {entry.isIntersecting ? entry.target.play() : entry.target.pause();});
}, {threshold: 0.6});
videos.forEach(v => observer.observe(v));
</script>
</body>
</html>
