<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaijaVoice AI</title>
<style>
  body { background:#000; color:#fff; font-family:Arial; margin:0; padding:20px; text-align:center; }
  h1 { color:#ff0000; font-size:28px; }
 .lang { margin:10px; padding:8px; border-radius:5px; background:#222; color:#fff; }
  #chat { height:400px; overflow-y:auto; background:#111; padding:10px; border-radius:10px; margin:15px 0; text-align:left; }
 .user { background:#ff0000; padding:10px; border-radius:10px; margin:5px 0; text-align:right; }
 .ai { background:#333; padding:10px; border-radius:10px; margin:5px 0; }
  input { width:60%; padding:12px; border-radius:20px; border:none; background:#222; color:#fff; }
  button { padding:12px 20px; border:none; border-radius:20px; cursor:pointer; }
 .send { background:#ff0000; color:#fff; }
 .mic { background:#008751; color:#fff; }
 .video-btn { background:#008751; color:#fff; margin-top:10px; }
  img { max-width:100%; border-radius:10px; margin-top:10px; }
</style>
</head>
<body>

<h1>🇳🇬 NaijaVoice AI</h1>
<p>Talk to me in any language + Generate AI Video</p>

<select id="lang" class="lang">
  <option value="en">English</option>
  <option value="ig">Igbo</option>
  <option value="yo">Yoruba</option>
  <option value="pi">Pidgin</option>
</select>

<div id="chat"></div>

<input type="text" id="input" placeholder="Type or use mic...">
<button class="mic" onclick="startMic()">🎤</button>
<button class="send" onclick="sendMsg()">Send</button>

<input type="text" id="videoPrompt" placeholder="Describe video: e.g 'Nollywood actor dancing'" style="width:80%; margin-top:10px;">
<button class="video-btn" onclick="generateVideo()">🎬 Generate AI Video</button>
<div id="videoResult"></div>

<script>
const chat = document.getElementById('chat');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;

function addMsg(text, who) {
  chat.innerHTML += `<div class="${who}">${text}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

function speak(text, lang) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'ig'? 'en-NG' : lang === 'yo'? 'en-NG' : 'en-US';
  synth.speak(u);
}

function getAIResponse(userText, lang) {
  userText = userText.toLowerCase();

  if(userText.includes('afa') || userText.includes('kedu') || userText.includes('ndewo')) {
    return lang === 'ig'? "Ndewo! Kedu ka m ga-esi nyere gị aka taa?" : "Hello! How can I help you?";
  }
  if(userText.includes('bawo') || userText.includes('dalu')) {
    return lang === 'yo'? "Bawo ni! Kí ni mo lè ṣe fún ọ lónìí?" : "Hello! How can I help you?";
  }
  if(userText.includes('how far') || userText.includes('wetin')) {
    return lang === 'pi'? "I dey o! Wetin I fit do for you today?" : "I'm here! What can I do for you?";
  }
  if(userText.includes('movie')) {
    return "Omo, go check NaijaFlix! We get 30 Nollywood movies for you. Link: movies.html";
  }
  return "I hear you o. You talk say: " + userText;
}

function sendMsg() {
  const text = document.getElementById('input').value;
  const lang = document.getElementById('lang').value;
  if(!text) return;
  addMsg(text, 'user');
  document.getElementById('input').value = '';

  setTimeout(() => {
    const reply = getAIResponse(text, lang);
    addMsg(reply, 'ai');
    speak(reply, lang);
  }, 500);
}

function startMic() {
  if(!SpeechRecognition) { alert("Mic no dey your browser"); return; }
  const rec = new SpeechRecognition();
  rec.lang = 'en-NG';
  rec.onresult = (e) => {
    document.getElementById('input').value = e.results[0][0].transcript;
    sendMsg();
  }
  rec.start();
}

// FAKE AI VIDEO GENERATOR - uses free image API as video placeholder
function generateVideo() {
  const prompt = document.getElementById('videoPrompt').value;
  if(!prompt) { alert("Describe the video first"); return; }
  addMsg("Generating video: " + prompt, 'user');
  document.getElementById('videoResult').innerHTML = "⏳ Generating... wait 5 seconds";

  // This uses a free image API. Real video needs paid API like Runway or Pika
  setTimeout(() => {
    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + ", cinematic, 4k")}`;
    document.getElementById('videoResult').innerHTML = `
      <img src="${imgUrl}">
      <p>AI Image generated. For real video, we go need to connect Pika or Runway API.</p>
    `;
    addMsg("Your AI video/image is ready!", 'ai');
  }, 2000);
}
</script>

</body>
</html>
