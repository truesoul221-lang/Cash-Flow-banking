<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaijaVoice AI - Speak Any Language</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #141414; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; }

  header { background: #000; padding: 15px; text-align: center; }
  header h1 { color: #e50914; }
  header p { font-size: 12px; color: #aaa; }

  #chat { flex: 1; overflow-y: auto; padding: 20px; }
 .msg { margin: 10px 0; padding: 12px; border-radius: 10px; max-width: 80%; }
 .user { background: #e50914; margin-left: auto; }
 .ai { background: #222; margin-right: auto; }

  #inputArea { display: flex; padding: 15px; background: #000; gap: 10px; }
  #userInput { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #333; color: #fff; }
  #sendBtn, #micBtn { padding: 12px 20px; border: none; border-radius: 20px; background: #e50914; color: #fff; cursor: pointer; font-weight: bold; }
  #micBtn { background: #008751; }

 .lang-select { padding: 10px; background: #000; text-align: center; }
  select { padding: 8px; background: #333; color: #fff; border: none; border-radius: 5px; }
</style>
</head>
<body>

<header>
  <h1>🇳🇬 NaijaVoice AI</h1>
  <p>Talk to me in any language</p>
</header>

<div class="lang-select">
  <label>AI Reply Language: </label>
  <select id="langSelect">
    <option value="en-US">English</option>
    <option value="yo-NG">Yoruba</option>
    <option value="ig-NG">Igbo</option>
    <option value="ha-NG">Hausa</option>
    <option value="pcm-NG">Pidgin</option>
    <option value="fr-FR">French</option>
  </select>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input type="text" id="userInput" placeholder="Type or use mic...">
  <button id="micBtn">🎤</button>
  <button id="sendBtn">Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const langSelect = document.getElementById('langSelect');

  // AI BRAIN - Simple but smart
  function getAIResponse(userText, lang) {
    userText = userText.toLowerCase();

    if(userText.includes('hello') || userText.includes('bawo') || userText.includes('ndewo') || userText.includes('sannu')) {
      if(lang.includes('yo')) return "Bawo ni! Kí ni mo lè ṣe fún ọ lónìí?";
      if(lang.includes('ig')) return "Ndewo! Kedu ka m ga-esi nyere gị aka taa?";
      if(lang.includes('ha')) return "Sannu! Ta yaya zan iya taimaka muku yau?";
      if(lang.includes('pcm')) return "How you dey? Wetin I fit do for you today?";
      return "Hello! How can I help you today?";
    }

    if(userText.includes('movie') || userText.includes('film')) {
      if(lang.includes('pcm')) return "Omo, go check NaijaFlix! We get 30 Nollywood movies for you. Wetin kind movie you want?";
      return "You should check NaijaFlix! We have 30 Nollywood movies. What kind of movie do you want?";
    }

    if(lang.includes('pcm')) return "I hear you o. You talk say: " + userText + ". Abeg explain well make I help you.";
    return "I understand. You said: " + userText + ". How can I help you with that?";
  }

  // TEXT TO SPEECH
  function speak(text, lang) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = lang;
    speech.rate = 1;
    window.speechSynthesis.speak(speech);
  }

  // SPEECH TO TEXT
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  if(SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-US';

    micBtn.onclick = () => {
      recognition.lang = langSelect.value;
      recognition.start();
      micBtn.textContent = "🔴";
    };

    recognition.onresult = (e) => {
      input.value = e.results[0][0].transcript;
      micBtn.textContent = "🎤";
    };
    recognition.onend = () => micBtn.textContent = "🎤";
  }

  // SEND MESSAGE
  function sendMessage() {
    const text = input.value.trim();
    if(!text) return;

    // Show user message
    chat.innerHTML += `<div class="msg user">${text}</div>`;

    // Get AI response
    const lang = langSelect.value;
    const aiReply = getAIResponse(text, lang);

    setTimeout(() => {
      chat.innerHTML += `<div class="msg ai">${aiReply}</div>`;
      speak(aiReply, lang);
      chat.scrollTop = chat.scrollHeight;
    }, 500);

    input.value = '';
    chat.scrollTop = chat.scrollHeight;
  }

  sendBtn.onclick = sendMessage;
  input.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
</script>

</body>
</html>
