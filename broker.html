<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUESOUL BROKER</title>
<style>
  body { margin:0; background:#0D0D0D; color:#fff; font-family:Arial; }
  .nav { background:#111; padding:15px; display:flex; justify-content:space-between; border-bottom:2px solid #F7931A; }
  .logo { color:#F7931A; font-weight:bold; font-size:20px; }
  .container { max-width:1000px; margin:0 auto; padding:20px; }
  .card { background:#1A1A1A; padding:20px; border-radius:12px; margin:20px 0; }
  input { width:100%; padding:12px; background:#2a2a2a; border:1px solid #444; color:#fff; border-radius:8px; margin:8px 0; box-sizing:border-box; }
  button { width:100%; padding:14px; background:#F7931A; border:none; color:#000; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:10px; }
  .btn-buy { background:#00ff88; width:49%; }
  .btn-sell { background:#ff4444; width:49%; }
  .price { font-size:24px; color:#F7931A; }
  .hidden { display:none; }
  .history { font-size:12px; color:#aaa; }
</style>
</head>
<body>

<div class="nav">
  <div class="logo">₿ TRUESOUL BROKER</div>
  <div id="navBalance" class="hidden">Balance: $<span id="balance">10000.00</span></div>
</div>

<div class="container">
  
  <!-- LOGIN / REGISTER -->
  <div class="card" id="authBox">
    <h2>Login / Register</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
    <button onclick="register()" style="background:#444; color:#fff;">CREATE ACCOUNT</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="card">
      <h2>Live Market</h2>
      <div>Bitcoin: <span class="price" id="btcPrice">Loading...</span></div>
      <div>Ethereum: <span class="price" id="ethPrice">Loading...</span></div>
    </div>

    <div class="card">
      <h2>Trade Demo</h2>
      <select id="coin" style="width:100%; padding:12px; background:#2a2a2a; border:1px solid #444; color:#fff; border-radius:8px;">
        <option value="bitcoin">Bitcoin BTC</option>
        <option value="ethereum">Ethereum ETH</option>
      </select>
      <input type="number" id="amount" placeholder="Enter USD Amount">
      <div style="display:flex; gap:10px;">
        <button class="btn-buy" onclick="trade('buy')">BUY</button>
        <button class="btn-sell" onclick="trade('sell')">SELL</button>
      </div>
      <div id="tradeResult" style="margin-top:15px; color:#888;"></div>
    </div>

    <div class="card">
      <h2>Trade History</h2>
      <div id="history" class="history">No trades yet</div>
      <button onclick="logout()" style="background:#555; color:#fff;">LOGOUT</button>
    </div>
  </div>

</div>

<script>
let prices = {bitcoin:0, ethereum:0};
let currentUser = null;

// Load user from browser storage
function loadUser(){
  currentUser = JSON.parse(localStorage.getItem('brokerUser'));
  if(currentUser){
    document.getElementById('authBox').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('navBalance').classList.remove('hidden');
    document.getElementById('balance').innerText = currentUser.balance.toFixed(2);
    showHistory();
  }
}

function register(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  if(!u || !p) return alert('Fill all fields');
  const user = {username:u, password:p, balance:10000, history:[]};
  localStorage.setItem('brokerUser', JSON.stringify(user));
  alert('Account created! Now login');
}

function login(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const user = JSON.parse(localStorage.getItem('brokerUser'));
  if(user && user.username==u && user.password==p){
    currentUser = user;
    loadUser();
  } else alert('Wrong username or password');
}

function logout(){
  currentUser = null;
  localStorage.removeItem('brokerUser');
  location.reload();
}

async function getPrices(){
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
    const data = await res.json();
    prices.bitcoin = data.bitcoin.usd;
    prices.ethereum = data.ethereum.usd;
    document.getElementById('btcPrice').innerText = '$' + prices.bitcoin.toLocaleString();
    document.getElementById('ethPrice').innerText = '$' + prices.ethereum.toLocaleString();
  } catch(e){}
}

function trade(type){
  const coin = document.getElementById('coin').value;
  const amount = parseFloat(document.getElementById('amount').value);
  if(!amount) return alert('Enter amount');
  if(type=='buy' && amount > currentUser.balance) return alert('Insufficient balance');
  
  if(type=='buy') currentUser.balance -= amount;
  if(type=='sell') currentUser.balance += amount;
  
  const trade = `${new Date().toLocaleTimeString()} - ${type.toUpperCase()} $${amount} ${coin}`;
  currentUser.history.unshift(trade);
  
  localStorage.setItem('brokerUser', JSON.stringify(currentUser));
  document.getElementById('balance').innerText = currentUser.balance.toFixed(2);
  document.getElementById('tradeResult').innerText = trade + ' - SUCCESS [DEMO]';
  showHistory();
}

function showHistory(){
  document.getElementById('history').innerHTML = currentUser.history.slice(0,5).join('<br>') || 'No trades yet';
}

loadUser();
getPrices();
setInterval(getPrices, 10000);
</script>

</body>
  </html>
