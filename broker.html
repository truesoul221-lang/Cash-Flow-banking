<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL - TRUESOUL BROKER</title>
<style>
  body { margin:0; background:#0B0E11; color:#EAECEF; font-family:Arial; padding:20px; }
  .header { background:#181A20; padding:20px; border-radius:8px; border:1px solid #F0B90B; margin-bottom:20px; }
  .header h1 { color:#F0B90B; margin:0; }
  .stats { display:flex; gap:15px; margin:20px 0; }
  .stat-card { background:#181A20; padding:15px; border-radius:8px; flex:1; border:1px solid #2B3139; }
  .stat-num { font-size:24px; color:#00D395; font-weight:bold; }
  table { width:100%; background:#181A20; border-radius:8px; border-collapse:collapse; }
  th { background:#2B3139; padding:12px; text-align:left; color:#F0B90B; }
  td { padding:12px; border-bottom:1px solid #2B3139; }
  .btn { padding:6px 12px; background:#F6465D; border:none; color:#fff; border-radius:4px; cursor:pointer; }
  .btn-green { background:#00D395; color:#000; }
  input { padding:8px; background:#2B3139; border:1px solid #444; color:#fff; border-radius:4px; }
</style>
</head>
<body>

<div class="header">
  <h1>🔒 TRUESOUL ADMIN PANEL</h1>
  <p>Manage all users and balances</p>
</div>

<div class="stats">
  <div class="stat-card">
    <div>Total Users</div>
    <div class="stat-num" id="totalUsers">0</div>
  </div>
  <div class="stat-card">
    <div>Total USDT</div>
    <div class="stat-num">$<span id="totalUSDT">0</span></div>
  </div>
  <div class="stat-card">
    <div>Total BTC</div>
    <div class="stat-num" id="totalBTC">0</div>
  </div>
</div>

<div style="background:#181A20; padding:15px; border-radius:8px; margin-bottom:20px;">
  <h3>Edit User Balance</h3>
  <input type="text" id="editUser" placeholder="Enter Username">
  <input type="number" id="addUSDT" placeholder="Add $USDT">
  <button class="btn-green" onclick="addBalance()">ADD BALANCE</button>
  <button class="btn" onclick="resetUser()">RESET USER</button>
</div>

<table>
  <thead>
    <tr>
      <th>Username</th>
      <th>USDT Balance</th>
      <th>BTC</th>
      <th>ETH</th>
      <th>Orders</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="userTable">
    <tr><td colspan="6">No users yet. Users save to their browser.</td></tr>
  </tbody>
</table>

<script>
function loadAdmin(){
  // This reads all users from localStorage
  // Note: localStorage is per-browser. For real broker we need database
  let users = [];
  for(let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if(key.includes('brokerUser')){
      users.push(JSON.parse(localStorage.getItem(key)));
    }
  }
  
  let totalUSDT = 0, totalBTC = 0;
  let html = '';
  
  users.forEach(user => {
    if(!user.assets) user.assets = {usdt:10000, btc:0, eth:0};
    totalUSDT += user.assets.usdt;
    totalBTC += user.assets.btc;
    
    html += `<tr>
      <td>${user.username}</td>
      <td>$${user.assets.usdt.toFixed(2)}</td>
      <td>${user.assets.btc.toFixed(8)}</td>
      <td>${user.assets.eth.toFixed(8)}</td>
      <td>${user.history ? user.history.length : 0}</td>
      <td><button class="btn" onclick="deleteUser('${user.username}')">DELETE</button></td>
    </tr>`;
  });
  
  document.getElementById('userTable').innerHTML = html || '<tr><td colspan="6">No users yet</td></tr>';
  document.getElementById('totalUsers').innerText = users.length;
  document.getElementById('totalUSDT').innerText = totalUSDT.toFixed(2);
  document.getElementById('totalBTC').innerText = totalBTC.toFixed(8);
}

function addBalance(){
  const username = document.getElementById('editUser').value;
  const amount = parseFloat(document.getElementById('addUSDT').value);
  const user = JSON.parse(localStorage.getItem('brokerUserPro'));
  
  if(user && user.username == username){
    user.assets.usdt += amount;
    localStorage.setItem('brokerUserPro', JSON.stringify(user));
    alert(`Added $${amount} to ${username}`);
    loadAdmin();
  } else alert('User not found in this browser');
}

function deleteUser(username){
  if(confirm('Delete this user?')){
    localStorage.removeItem('brokerUserPro');
    loadAdmin();
  }
}

function resetUser(){
  const username = document.getElementById('editUser').value;
  const user = JSON.parse(localStorage.getItem('brokerUserPro'));
  if(user && user.username == username){
    user.assets = {usdt:10000, btc:0, eth:0};
    user.history = [];
    localStorage.setItem('brokerUserPro', JSON.stringify(user));
    alert('User reset to $10,000');
    loadAdmin();
  }
}

loadAdmin();
setInterval(loadAdmin, 5000); // auto refresh every 5s
</script>

</body>
</html>
