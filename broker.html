<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueSoulFX Broker</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 20px; text-align: center; }
.container { max-width: 400px; margin: auto; background: #1a1a1a; padding: 20px; border-radius: 10px; }
input, button { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; font-size: 16px; }
button { background: #00d4ff; color: #000; font-weight: bold; cursor: pointer; }
button:hover { background: #00aaff; }
.balance { font-size: 28px; color: #00ff88; text-align: center; margin: 20px 0; font-weight: bold; }
h2 { color: #00d4ff; }
h3 { margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h2>TrueSoulFX Broker</h2>
  
  <div class="balance">Balance: ₦<span id="balance">0.00</span></div>

  <h3>Deposit Funds</h3>
  <input type="email" id="email" placeholder="Enter your email" value="maroejiata02@gmail.com">
  <input type="number" id="amount" placeholder="Amount in Naira" min="100">
  <button onclick="payWithPaystack()">Deposit Now</button>

  <h3>Reset User</h3>
  <button onclick="resetUser()" style="background: #ff4444;">Reset Balance to 0</button>
</div>

<script>
// YOUR PAYSTACK KEYS - DO NOT SHARE SECRET KEY
const PUBLIC_KEY = "pk_test_f4fb7830b3df14c1739a0z"; 

let balance = parseFloat(localStorage.getItem('tsfx_balance')) || 0;
document.getElementById('balance').innerText = balance.toFixed(2);

function updateBalance() {
  localStorage.setItem('tsfx_balance', balance);
  document.getElementById('balance').innerText = balance.toFixed(2);
}

// PAYSTACK PAYMENT FUNCTION
function payWithPaystack() {
  let email = document.getElementById('email').value;
  let amount = document.getElementById('amount').value;

  if(!email || !amount || amount < 100) { 
    alert("Enter valid email and amount min ₦100"); 
    return; 
  }

  let handler = PaystackPop.setup({
    key: PUBLIC_KEY,
    email: email,
    amount: amount * 100, // Paystack uses kobo
    currency: "NGN",
    ref: 'TSFX_'+Math.floor((Math.random() * 1000000) + 1),
    callback: function(response){
      alert('Payment successful! Ref: ' + response.reference);
      balance += parseFloat(amount);
      updateBalance();
    },
    onClose: function(){
      alert('Payment cancelled');
    }
  });
  handler.openIframe();
}

// RESET USER FUNCTION
function resetUser() {
  if(confirm("Are you sure you want to reset balance to 0?")) {
    balance = 0;
    updateBalance();
    alert("User reset successfully");
  }
}

// LOAD PRICE FUNCTION
async function loadPrice() {
  try {
    let res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    let data = await res.json();
    console.log("BTC Price: ", data.price);
  } catch(e) {
    console.log("Price load error", e);
  }
}
loadPrice();
</script>
</body>
</html>
