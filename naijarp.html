<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija RP - Lagos v2</title>
<style>
  body { margin:0; background:#000; color:#fff; font-family:Arial; overflow:hidden; }
  #hud { position:absolute; top:10px; left:10px; background:#000aa; padding:10px; border-radius:10px; z-index:10; }
  #money { position:absolute; top:10px; right:10px; color:#008751; font-size:20px; }
  #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:30px; color:#00ff00; }
  #info { position:absolute; bottom:5px; width:100%; text-align:center; font-size:11px; background:#000aa; }
  canvas { display:block; }
  #start { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); 
    background:#008751; padding:20px; border-radius:10px; cursor:pointer; font-size:20px; }
  
  /* MOBILE JOYSTICK */
  #joystick { position:absolute; bottom:50px; left:50px; width:100px; height:100px; 
    background:#ffffff22; border-radius:50%; border:2px solid #fff; display:none; }
  #joystick-btn { position:absolute; width:40px; height:40px; background:#fff; 
    border-radius:50%; top:30px; left:30px; }
  #btnShoot { position:absolute; bottom:50px; right:50px; width:70px; height:70px; 
    background:#ff0000aa; border-radius:50%; display:none; text-align:center; line-height:70px; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" }
</script>
</head>
<body>

<div id="hud">Wanted: <span id="wanted">0</span>★ | Health: <span id="health">100</span></div>
<div id="money">₦<span id="cash">5000</span></div>
<div id="crosshair">+</div>
<div id="info">Drag left = Move | Drag right = Look | Red button = Punch/Rob | F = Danfo</div>
<div id="start" onclick="startGame()">🇳🇬 START LAGOS LIFE</div>

<div id="joystick"><div id="joystick-btn"></div></div>
<div id="btnShoot" onclick="punch()">PUNCH</div>

<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, cash=5000, wanted=0;
let keys = {w:0,s:0,a:0,d:0}, npcs = [], gameStarted = false;
let moveX=0, moveZ=0;

function startGame() {
  document.getElementById('start').style.display = 'none';
  document.getElementById('joystick').style.display = 'block';
  document.getElementById('btnShoot').style.display = 'block';
  gameStarted = true;
  init();
  animate();
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 0, 200);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0);

  renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const sun = new THREE.DirectionalLight(0xffffcc, 0.8);
  sun.position.set(10,20,10);
  scene.add(sun);

  // ROAD
  const road = new THREE.Mesh(new THREE.PlaneGeometry(300, 20), new THREE.MeshStandardMaterial({color:0x333333}));
  road.rotation.x = -Math.PI/2;
  scene.add(road);

  // BUILDINGS
  for(let i=0; i<25; i++){
    const height = Math.random()*12 + 4;
    const building = new THREE.Mesh(new THREE.BoxGeometry(8, height, 8), new THREE.MeshStandardMaterial({color: 0xdddddd}));
    building.position.set(Math.random()*200-100, height/2, Math.random()*80-40);
    if(Math.abs(building.position.z) > 15) scene.add(building);
  }

  // DANFO + OKADA
  const danfo = new THREE.Mesh(new THREE.BoxGeometry(6,3,3), new THREE.MeshStandardMaterial({color:0xffff00}));
  danfo.position.set(10,1.5,0);
  scene.add(danfo);

  const okada = new THREE.Mesh(new THREE.BoxGeometry(1.5,1,2), new THREE.MeshStandardMaterial({color:0x000000}));
  okada.position.set(-10,0.5,2);
  scene.add(okada);

  // NPCS
  for(let i=0; i<8; i++){
    const npc = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1.5, 4, 8), new THREE.MeshStandardMaterial({color:0x8B4513}));
    npc.position.set(Math.random()*40-20, 0.75, Math.random()*40-20);
    scene.add(npc);
    npcs.push(npc);
  }

  // JOYSTICK
  setupJoystick();
  document.addEventListener('click', (e)=>{ if(e.target.id!== 'btnShoot') punch(); });
  document.addEventListener('keydown', e => {
    if(e.key.toLowerCase() === 'r') rob();
    if(e.key.toLowerCase() === 'f') enterDanfo();
  });
}

function setupJoystick() {
  const joy = document.getElementById('joystick');
  joy.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    const rect = joy.getBoundingClientRect();
    moveX = (touch.clientX - rect.left - 50) / 50;
    moveZ = (touch.clientY - rect.top - 50) / 50;
  });
  joy.addEventListener('touchend', ()=>{ moveX=0; moveZ=0; });
}

function punch() {
  npcs.forEach((npc,i) => {
    if(camera.position.distanceTo(npc.position) < 3) {
      scene.remove(npc);
      npcs.splice(i,1);
      cash += 500;
      wanted += 1;
      document.getElementById('cash').innerText = cash;
      document.getElementById('wanted').innerText = wanted;
      if(wanted > 3) alert("🚨 POLICE DEY COME! RUN!");
    }
  });
}

function rob() {
  cash += 1000;
  wanted += 2;
  document.getElementById('cash').innerText = cash;
  document.getElementById('wanted').innerText = wanted;
  alert("You robbed someone! 🚨");
}

function enterDanfo() {
  alert("Conductor: 'Owo bus 200 naira! No change!' 😂");
  cash -= 200;
  document.getElementById('cash').innerText = cash;
}

function movePlayer() {
  const speed = 0.2;
  camera.position.x += moveX * speed;
  camera.position.z += moveZ * speed;
}

function animate() {
  if(!gameStarted) return;
  requestAnimationFrame(animate);
  movePlayer();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
